services:
  app:
    image: backend59
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:example@mongo:27017/admin
      DB_NAME: expenditures
    volumes:
      - .:/app
      - /app/node_modules
    command: npx nodemon -L app.js
    #command: node app.js
    restart: unless-stopped

  mongo:
    image: mongo:latest
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./db:/data/db

volumes:
  mongo_data:
    driver: local